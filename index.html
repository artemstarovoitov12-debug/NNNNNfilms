<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NNNNN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-badge">N</div>
          <div>
            <p class="brand-tag">Фильмы</p>
            <h1>NNNNN</h1>
          </div>
        </div>
        <div id="userBlock" class="user-block hidden">
          <span id="currentUserLabel"></span>
          <button id="logoutBtn" class="secondary-btn">Выйти</button>
        </div>
      </header>
      <main>
        <section id="authSection" class="auth-section">
          <div class="auth-card">
            <h2>Регистрация</h2>
            <form id="registerForm" class="auth-form" action="#" method="post" onsubmit="return false;"></form>
              <label>Никнейм<input type="text" id="registerNickname" name="nickname" placeholder="Введите никнейм" required /></label>
              <label>Пароль<input type="password" id="registerPassword" name="password" placeholder="Введите пароль" required /></label>
             <button type="button" class="primary-btn" onclick="tvRegister()">Создать аккаунт</button> 
            </form>
          </div>
          <div class="auth-card">
            <h2>Вход</h2>
           <form id="loginForm" class="auth-form" action="#" method="post" onsubmit="return false;"></form>
              <label>Никнейм<input type="text" id="loginNickname" name="nickname" placeholder="Введите никнейм" required /></label>
              <label>Пароль<input type="password" id="loginPassword" name="password" placeholder="Введите пароль" required /></label>
              <button type="button" class="primary-btn" onclick="tvLogin()">Войти</button>
            </form>
            <p id="authMessage" class="message" aria-live="polite"></p>
          </div>
        </section>
        <section id="appSection" class="app-section hidden">
          <div class="toolbar">
            <div class="search-box">
              <label for="searchInput">Поиск</label>
              <input id="searchInput" type="text" placeholder="Введите название" />
            </div>
            <button id="adminToggleBtn" class="admin-btn hidden">Открыть админ-панель</button>
          </div>
          <div id="videosList" class="videos-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <div id="adminModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="adminTitle">Панель администратора</h3>
          <button id="closeAdminModal" class="icon-btn" aria-label="Закрыть">×</button>
        </div>
        <form id="adminVideoForm" class="admin-form">
          <label>Название<input type="text" id="videoTitle" name="title" placeholder="Введите название" required /></label>
          <label>Описание фильма<textarea id="videoDescription" name="description" rows="4" placeholder="Напишите короткое описание" required></textarea></label>
          <label>Ссылка на фильм<input type="url" id="videoUrl" placeholder="https://example.com/film" required /></label>
          <label>Иконка фильма<input type="file" id="videoIcon" accept="image/*" /></label>
          <button type="submit" class="primary-btn">Добавить фильм</button>
        </form>
      </div>
    </div>
    <div id="filmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="filmTitle">
      <div class="film-modal-content">
        <div class="modal-header"><button id="closeFilmModal" class="icon-btn" aria-label="Закрыть">×</button></div>
        <div class="film-viewer">
          <div class="film-player-wrap">
            <video id="filmPlayer" controls playsinline></video>
            <a id="filmWatchLink" class="film-watch-link" href="#" target="_blank" rel="noopener noreferrer">Смотреть фильм</a>
          </div>
          <h3 id="filmTitle" class="film-title">Название фильма</h3>
          <p id="filmDescription" class="film-description"></p>
        </div>
      </div>
    </div>
    <div id="deleteConfirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
      <div class="confirm-modal-content">
        <h3 id="deleteConfirmTitle">Вы точно хотите удалить?</h3>
        <div class="confirm-actions">
          <button id="confirmDeleteBtn" class="confirm-btn delete-btn" type="button">Да</button>
          <button id="cancelDeleteBtn" class="confirm-btn cancel-btn" type="button">Нет</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
  
<script>
var SUPABASE_URL_TV = 'https://cpngyotbjpdmiocoutla.supabase.co';
var SUPABASE_KEY_TV = 'sb_publishable_41RYlW2KJXoxCmtVCtO0xQ_CsWWlhPN';

function tvMessage(text) {
  var message = document.getElementById('authMessage');

  if (message) {
    message.innerHTML = text;
  }
}

function tvRequest(functionName, nickname, password, callback) {
  tvMessage('Соединение с сервером...');

  var xhr = new XMLHttpRequest();

  xhr.open(
    'POST',
    SUPABASE_URL_TV + '/rest/v1/rpc/' + functionName,
    true
  );

  xhr.setRequestHeader('apikey', SUPABASE_KEY_TV);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY_TV);
  xhr.setRequestHeader('Content-Type', 'application/json');

  xhr.onreadystatechange = function() {
    if (xhr.readyState != 4) {
      return;
    }

    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(null, data);
      } catch (e) {
        callback('Телевизор не смог прочитать ответ сервера.', null);
      }

      return;
    }

    callback(
      'Ошибка соединения. Код: ' + xhr.status,
      null
    );
  };

  xhr.onerror = function() {
    callback('Не удалось соединиться с Supabase.', null);
  };

  xhr.send(JSON.stringify({
    p_nickname: nickname,
    p_password: password
  }));
}

function tvRegister() {
  var nicknameInput = document.getElementById('registerNickname');
  var passwordInput = document.getElementById('registerPassword');

  var nickname = nicknameInput.value;
  var password = passwordInput.value;

  if (!nickname || !password) {
    tvMessage('Введите никнейм и пароль.');
    return;
  }

  tvMessage('Регистрация...');

  tvRequest(
    'register_user',
    nickname,
    password,
    function(error, data) {
      if (error) {
        tvMessage(error);
        return;
      }

      if (!data || !data.ok) {
        if (data && data.message) {
          tvMessage(data.message);
        } else {
          tvMessage('Не удалось зарегистрироваться.');
        }

        return;
      }

      nicknameInput.value = '';
      passwordInput.value = '';

      tvMessage('Аккаунт создан. Теперь войдите.');
    }
  );
}

function tvLoadVideos() {
  var xhr = new XMLHttpRequest();

  xhr.open(
    'GET',
    SUPABASE_URL_TV + '/rest/v1/movies?select=*&order=created_at.desc',
    true
  );

  xhr.setRequestHeader('apikey', SUPABASE_KEY_TV);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY_TV);

  xhr.onreadystatechange = function() {
    if (xhr.readyState != 4) {
      return;
    }

    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        var movies = JSON.parse(xhr.responseText);
        tvRenderVideos(movies);
      } catch (e) {
        tvMessage('Не удалось прочитать список фильмов.');
      }

      return;
    }

    tvMessage('Не удалось загрузить фильмы. Код: ' + xhr.status);
  };

  xhr.onerror = function() {
    tvMessage('Ошибка соединения при загрузке фильмов.');
  };

  xhr.send();
}

function tvRenderVideos(movies) {
  var videosList = document.getElementById('videosList');

  if (!videosList) {
    return;
  }

  if (!movies || movies.length === 0) {
    videosList.innerHTML =
      '<div class="empty-state">Фильмов пока нет.</div>';
    return;
  }

  var html = '';

  for (var i = 0; i < movies.length; i++) {
    var movie = movies[i];

    var title = movie.title || '';
    var description = movie.description || '';
    var icon = movie.icon_data_url || '';
    var addedBy = movie.added_by || 'Неизвестно';
    var url = movie.url || '#';

    var iconHtml = '';

    if (icon) {
      iconHtml =
        '<img class="video-icon" src="' +
        icon +
        '" alt="Иконка фильма">';
    } else {
      iconHtml =
        '<div class="video-icon">FILM</div>';
    }

    html +=
      '<article class="video-card">' +
        '<div class="video-media">' +
          iconHtml +
        '</div>' +
        '<div class="video-info">' +
          '<h3>' + title + '</h3>' +
          '<p class="video-description-text">' +
            description +
          '</p>' +
          '<a href="' + url + '" target="_blank" class="open-film-btn">' +
            'Смотреть' +
          '</a>' +
          '<span class="video-meta">' +
            'Добавил: ' + addedBy +
          '</span>' +
        '</div>' +
      '</article>';
  }

  videosList.innerHTML = html;
}

function tvLogin() {
  var nicknameInput = document.getElementById('loginNickname');
  var passwordInput = document.getElementById('loginPassword');

  var nickname = nicknameInput.value;
  var password = passwordInput.value;

  if (!nickname || !password) {
    tvMessage('Введите никнейм и пароль.');
    return;
  }

  tvMessage('Вход...');

  tvLoadVideos();

  tvRequest(
    'login_user',
    nickname,
    password,
    function(error, data) {
      if (error) {
        tvMessage(error);
        return;
      }

      if (!data || !data.ok) {
        if (data && data.message) {
          tvMessage(data.message);
        } else {
          tvMessage('Неверный никнейм или пароль.');
        }

        return;
      }

      try {
        localStorage.setItem(
          'videoHubCurrentUser',
          JSON.stringify({
            nickname: data.nickname
          })
        );
      } catch (e) {
      }

      document.getElementById('authSection').className =
        'auth-section hidden';

      document.getElementById('appSection').className =
        'app-section';

      document.getElementById('userBlock').className =
        'user-block';

      document.getElementById('currentUserLabel').innerHTML =
  'Вы вошли как: ' + data.nickname;

tvMessage('');

tvLoadVideos();
    }
  );
}
</script>

</body>
</html>
